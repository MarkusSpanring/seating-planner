<!DOCTYPE html>
<html lang="de">

<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Sitzplan – Wedding Seating Planner</title>
  <meta name="description" content="Interactive wedding seating plan manager" />
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&display=swap" rel="stylesheet" />
  <link rel="stylesheet" href="style.css" />
</head>

<body>
  <div id="app">
    <!-- Header -->
    <header class="app-header">
      <div class="header-left">
        <h1>💒 Sitzplan</h1>
        <div class="venue-selector-wrap" id="venue-selector-wrap">
          <button class="venue-dropdown-btn" id="btn-venue-dropdown" title="Venue auswählen oder verwalten">
            <span class="venue-btn-icon">🏛️</span>
            <span class="venue-btn-name" id="venue-name-display">Hauptsaal</span>
            <span class="venue-btn-caret">▾</span>
          </button>
          <div class="venue-dropdown-menu" id="venue-dropdown-menu" style="display: none;">
            <div class="venue-dropdown-header">Venues</div>
            <div class="venue-dropdown-list" id="venue-dropdown-list"></div>
            <div class="venue-dropdown-divider"></div>
            <button class="venue-dropdown-action" id="btn-venue-create" title="Neue leere Venue oder mit übernommener Gästeliste erstellen">
              <span>➕</span> Neue Venue erstellen...
            </button>
            <button class="venue-dropdown-action" id="btn-venue-rename" title="Aktuelle Venue umbenennen">
              <span>✏️</span> Venue umbenennen...
            </button>
            <button class="venue-dropdown-action" id="btn-venue-size-dropdown" title="Saalgröße (Raummaße) in cm anpassen">
              <span>📐</span> Saalgröße anpassen...
            </button>
            <button class="venue-dropdown-action text-danger" id="btn-venue-delete" title="Aktuelle Venue löschen">
              <span>🗑️</span> Venue löschen
            </button>
          </div>
        </div>
      </div>
      <div class="header-right">
        <button class="btn btn-sm" id="btn-toggle-venue" title="Saalplan ein- oder ausblenden (Vollbild-Tabelle)"
          style="background-color: var(--bg-glass); border-color: var(--border-color); color: var(--text-primary);">
          <span class="venue-toggle-icon" id="venue-toggle-icon">◀</span>
          <span id="venue-toggle-label">Venue ausblenden</span>
        </button>
        <button class="btn btn-sm btn-accent" id="btn-print" title="Saalplan und Tischübersichten drucken oder als PDF exportieren"
          style="background-color: var(--bg-glass); border-color: var(--border-color); color: var(--text-primary);">
          🖨️ Venue drucken</button>
        <span class="stats-badge" id="stats-badge" title="Platzierungs-Übersicht: Platzierte Gäste / Gesamtgäste und Gesamtkapazität">
          <strong>0</strong> / 0 platziert · 0 Plätze gesamt
        </span>
      </div>
    </header>

    <!-- Main body -->
    <div class="app-body">
      <!-- Left: venue canvas -->
      <div class="venue-panel" id="venue-panel">
        <!-- Venue header with spawner toolbar -->
        <div class="venue-header">
          <div class="venue-header-left" style="display: flex; align-items: center; gap: 10px;">
            <h2 id="venue-title">Saalplan – Hauptsaal</h2>
            <button class="btn btn-sm" id="btn-venue-size" title="Saalgröße (Raummaße) in cm anpassen"
              style="background: var(--bg-glass); border-color: var(--border-color); color: var(--text-primary); font-weight: 500;">
              <span id="venue-size-label">📐 Saalgröße</span>
            </button>
          </div>
          <div class="venue-header-right" id="venue-toolbar-inline">
            <span id="custom-blueprint-buttons"></span>
            <button class="btn btn-sm" id="btn-open-blueprint" style="margin-left: 6px;" title="Tischvorlagen verwalten oder neue Vorlage erstellen">✏️ Vorlage erstellen</button>
          </div>
        </div>
        <!-- Canvas -->
        <div class="venue-canvas-area" id="venue-canvas-area">
          <div class="venue-container" id="venue-container">
            <!-- SVG rendered by JS -->
          </div>
          <div class="venue-legends-overlay" id="venue-legends-overlay"></div>
        </div>
      </div>

      <!-- Right: guest panel -->
      <div class="guest-panel">
        <div class="panel-header">
          <h2>Gäste</h2>
          <div class="panel-actions" style="display: flex; align-items: center; gap: 8px;">
            <input type="text" id="guest-filter-input"
              style="display: none; padding: 4px 8px; border-radius: 4px; border: 1px solid var(--border-color); background: var(--bg-card); color: var(--text-primary); font-size: 0.8rem; width: 140px;"
              placeholder="Name filtern..." title="Gästeliste nach Vor- oder Nachname filtern">
            <button class="btn btn-sm" id="btn-add-guest" style="display: none;" title="Neuen Gast zur Gästeliste hinzufügen">➕ Gast hinzufügen</button>
            <button class="btn btn-sm" id="btn-expand-all" title="Alle Tischgruppen ausklappen bzw. einklappen">⬇ Alle ausklappen</button>
            <input type="file" accept=".csv" id="csv-input" class="file-input-hidden" title="CSV-Datei auswählen" />
            <button class="btn btn-sm" id="btn-settings" style="display: none;" title="Einstellungen verwalten (Diäten, Altersgruppen, CSV-Export/Import)">⚙️ Einstellungen</button>
          </div>
        </div>
        <div class="panel-body" id="guest-list"></div>
      </div>
    </div>
  </div>

  <!-- Dynamic Modals Container -->
  <div id="modal-container"></div>

  <!-- Tooltip -->
  <div class="seat-tooltip" id="seat-tooltip" style="display:none"></div>

  <!-- Print: individual table pages rendered here -->
  <div id="print-table-pages" class="print-only"></div>

  <!-- Main ES Module Entry Point -->
  <script type="module" src="js/app.js"></script>
</body>

</html>
